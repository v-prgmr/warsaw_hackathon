# g1_ar_bridge parameters (ROS 2 params file), read by launch/ar_bridge.launch.py.
# Topics of the chest OAK-D are NOT verified yet (AGENTS.md §7): the anchor defaults to the head
# RealSense topics (verified names). Pass the OAK-D topics as launch arguments once known.

ar_bridge:
  ros__parameters:
    host: 0.0.0.0                 # WebSocket for the Lens: every interface, i.e. the Wi-Fi too
    port: 8787                    # fixed in the Lens (WS_PORT)
    map_frame: map
    robot_frame: robot_center     # = pelvis (g1_sensors); the robot box stands on the floor
    tag_frame_prefix: ar_tag_     # anchor TF map -> ar_tag_<id>, from tag_anchor
    ar_world_frame: ar_world      # published after registration: map -> ar_world (static)
    spectacles_frame: spectacles  # ar_world -> spectacles, x forward / y left / z up
    display_name: Unitree G1
    tag_id: 0                     # AprilTag 36h11
    tag_black_size_m: 0.16        # edge of the BLACK square, measured on the print
    base_height_m: 0.78           # robot_center above the floor (AGENTS.md §10.1: 0.77-0.79)
    min_views: 6                  # Spectacles views of the tag before commit
    min_baseline_m: 0.3           # the person must step sideways at least this much
    max_view_reproj_px: 4.0       # drop glasses frames whose tag fit is worse
    max_rms_px: 3.0               # multi-view fit needed to commit
    max_tilt_deg: 10.0            # refuse when robot and glasses disagree on "up" by more
    registration_timeout_s: 180.0
    pose_hz: 10.0
    lidar_hz: 2.0
    hmd_hz: 2.0                   # glasses pose polls (get_user_hmd_transform)
    cloud_topic: /cloud_map       # RTAB-Map map cloud (g1_mapping)
    cloud_voxel_m: 0.08
    cloud_max_points: 30000       # kept in memory; <= 1500 go to the glasses per frame
    path_topic: /plan             # Nav2 global path
    markers_topic: /ar_glasses/markers       # POIs / boxes (visualization_msgs/MarkerArray)
    user_command_topic: /ar_glasses/user_command
    hmd_pose_topic: /ar_glasses/hmd_pose
    status_topic: /ar_glasses/status

ar_tag_anchor:
  ros__parameters:
    map_frame: map
    tag_id: 0
    tag_black_size_m: 0.16
    tag_frame_prefix: ar_tag_
    image_topic: /camera/color/image_raw                         # head RealSense (verified)
    camera_info_topic: /camera/color/camera_info
    depth_topic: /camera/aligned_depth_to_color/image_raw        # "" = PnP only
    use_depth: true
    min_views: 10                 # frames while the robot stands still
    window_s: 3.0                 # the camera must not move within this window
    max_rate_hz: 5.0
    max_reproj_px: 2.0
    max_distance_m: 4.0
    stationary_pos_m: 0.01
    stationary_rot_deg: 0.5
    depth_max_angle_deg: 15.0     # ignore the depth plane if it disagrees more with PnP
    republish_pos_m: 0.01         # re-anchor when a new estimate differs by more
    republish_rot_deg: 0.5
    anchor_file: ""               # e.g. /ws/bags/ar_anchor.yaml to keep the last anchor
    load_saved: false             # only with the SAME RTAB-Map map (localization mode)
