explore_node:
  ros__parameters:
    use_sim_time: true
    robot_base_frame: base_footprint
    costmap_topic: /map
    costmap_updates_topic: /map_updates
    return_to_init: false
    visualize: true
    planner_frequency: 0.2
    progress_timeout: 60.0
    potential_scale: 3.0
    orientation_scale: 0.0
    gain_scale: 1.0
    transform_tolerance: 0.3
    min_frontier_size: 0.75
