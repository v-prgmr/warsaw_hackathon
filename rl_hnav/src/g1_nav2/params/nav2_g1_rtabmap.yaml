# ==========================
# Nav2 (Humble) - REAL G1 on the RTAB-Map map, high-level Loco executor
# Used by rtabmap_nav_dry_run.launch.py and rtabmap_nav_live.launch.py (g1_nav2/rtabmap_nav.py).
# Frames (AGENTS.md §6):
#   map -> odom -> robot_center   (g1_mapping: RTAB-Map + icp_odometry)
#   robot_center -> URDF links     (g1_sensors tf_chain)
# Topics:
#   /map (RTAB-Map), /odom (icp_odometry), /scan (pointcloud_to_laserscan + scan_restamper)
#   velocity: controller + behaviors -> <raw> -> velocity_smoother -> /cmd_vel (live) or
#             /g1_nav2_dry_run/cmd_vel (dry run); topics are set by the launch remappings.
# Speed limits match g1_loco_cmdvel's cmd_vel_gateway clamps (0.10 m/s, 0.20 rad/s). The
# launches override the controller, smoother and spin limits from max_vx / max_wz.
# The only real-robot Nav2 config: RTAB-Map owns the map, no SLAM Toolbox on the robot.
# ==========================

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: robot_center
    odom_topic: /odom
    bt_loop_duration: 10
    # default_nav_to_pose_bt_xml / default_nav_through_poses_bt_xml: set by the launch
    # (behavior_trees/*_g1.xml, the Humble defaults without BackUp)

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    global_frame: map
    robot_base_frame: robot_center
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

controller_server:
  ros__parameters:
    use_sim_time: false
    global_frame: odom
    robot_base_frame: robot_center
    odom_topic: /odom
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3

    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.20
      # Turning to face the path does not count as progress: 180 deg at 0.2 rad/s is ~16 s,
      # then 0.2 m at 0.1 m/s is 2 s.
      movement_time_allowance: 30.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    # Regulated Pure Pursuit, not DWB: at 0.10 m/s / 0.20 rad/s without reversing, DWB never
    # turned toward a goal behind the robot (isolated test with a kinematic fake robot, 0.011 m/s
    # and progress failures). RPP turns in place when the path is > 0.5 rad off the heading, then
    # follows it; goals ahead, behind and to the side all succeeded within the limits.
    controller_plugins: ["FollowPath"]
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.10              # = cmd_vel_gateway max_vx (launch arg max_vx)
      rotate_to_heading_angular_vel: 0.20   # = cmd_vel_gateway max_wz (launch arg max_wz)
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.5
      # Measured G1 turning threshold: 0.11 rad/s. RPP limits rotation relative
      # to measured yaw rate each cycle: 3.2 / 20 Hz = 0.16 rad/s from rest.
      # The old 1.0 / 20 = 0.05 could stay below the threshold indefinitely.
      max_angular_accel: 3.2
      allow_reversing: false                # the G1 does not walk backwards
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.03
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.03
      max_robot_pose_search_dist: 10.0
      transform_tolerance: 0.3

behavior_server:
  ros__parameters:
    use_sim_time: false
    cycle_frequency: 10.0
    global_frame: odom
    robot_base_frame: robot_center
    transform_tolerance: 0.3
    # No BackUp: the G1 does not walk backwards. The behavior trees use Spin and Wait only.
    behavior_plugins: ["spin", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    wait:
      plugin: "nav2_behaviors/Wait"
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.20   # = cmd_vel_gateway max_wz (launch arg max_wz)
    min_rotational_vel: 0.11   # measured minimum effective in-place turn rate
    rotational_acc_lim: 0.4

# -----------------
# COSTMAPS
# -----------------
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: robot_center
      update_frequency: 2.0
      publish_frequency: 1.0
      transform_tolerance: 0.3
      resolution: 0.05
      track_unknown_space: true
      rolling_window: false
      robot_radius: 0.30
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          obstacle_range: 3.0
          raytrace_range: 3.5

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.30
        cost_scaling_factor: 3.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: robot_center
      update_frequency: 8.0
      publish_frequency: 4.0
      transform_tolerance: 0.3
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      robot_radius: 0.30
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          obstacle_range: 2.5
          raytrace_range: 3.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.30
        cost_scaling_factor: 3.0

waypoint_follower:
  ros__parameters:
    use_sim_time: false

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    # Pure pursuit may ask for more than max_wz on tight curves: scale vx down with wz so the
    # robot keeps the commanded curvature instead of turning less than planned.
    scale_velocities: true
    feedback: "OPEN_LOOP"
    odom_topic: /odom
    max_velocity: [0.10, 0.0, 0.20]    # = cmd_vel_gateway clamps (launch args max_vx / max_wz)
    min_velocity: [0.0, 0.0, -0.20]    # no reversing
    # Match RPP yaw acceleration so smoothing does not prolong sub-threshold turns.
    # Zero remains valid; no minimum yaw clamp on curved forward paths.
    max_accel: [0.5, 0.0, 3.2]
    max_decel: [-0.5, 0.0, -3.2]
    # Zero once when no Nav2 command arrives for this long; cmd_vel_gateway's own watchdog also
    # stops the robot 0.30 s after the last /cmd_vel.
    velocity_timeout: 1.0
